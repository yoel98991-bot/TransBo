<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TransGo Driver — Blanco & Negro</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background: #000; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
    }

    .phone {
      width: 100%; 
      max-width: 410px; 
      height: 100vh; 
      max-height: 840px;
      background: #0a0a0a;
      border-radius: 0; 
      overflow: hidden; 
      position: relative;
      display: flex; 
      flex-direction: column;
    }

    @media (min-width: 480px) {
      .phone {
        border-radius: 44px;
        box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #333, 0 30px 60px rgba(0,0,0,0.9);
      }
    }

    .header {
      background: #0a0a0a; 
      padding: 14px 16px; 
      display: flex;
      justify-content: space-between; 
      align-items: center; 
      z-index: 20;
      border-bottom: 1px solid #1f1f1f;
    }

    .driver-avatar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: transparent;
      border: none;
      color: #fff;
      text-align: left;
    }

    .driver-avatar-btn img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #fff;
    }

    .driver-avatar-btn .name {
      font-weight: 600;
      font-size: 14px;
    }

    .driver-avatar-btn .rating {
      font-size: 11px;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 2px;
    }
    
    .status-badge-header {
      background: #141414; 
      color: #fff; 
      padding: 6px 12px; 
      border-radius: 20px;
      font-size: 11px; 
      font-weight: 600; 
      display: flex; 
      align-items: center; 
      gap: 6px;
      border: 1px solid #262626;
      transition: all 0.3s ease;
    }
    
    .dot {
      width: 7px; 
      height: 7px; 
      border-radius: 50%; 
      display: inline-block;
    }

    .status-badge-header.online .dot { 
      background: #fff;
      animation: pulse 1.5s infinite;
    }
    
    .status-badge-header.offline .dot { 
      background: #ff4444; 
    }

    #map { 
      flex: 1; 
      width: 100%; 
      background: #111; 
      z-index: 1; 
    }

    .bottom-panel {
      background: rgba(10, 10, 10, 0.95); 
      border-top: 1px solid #1f1f1f;
      padding: 16px 16px 24px; 
      z-index: 10; 
      backdrop-filter: blur(12px);
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
    }

    .card { 
      background: #141414; 
      border: 1px solid #262626; 
      border-radius: 20px; 
      padding: 16px; 
      text-align: left;
    }
    
    .btn {
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px;
      background: #1a1a1a; 
      color: #fff; 
      padding: 14px 20px; 
      border-radius: 16px;
      font-weight: 600; 
      font-size: 15px;
      border: none; 
      cursor: pointer; 
      width: 100%;
      transition: opacity 0.2s, transform 0.1s;
    }
    
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-primary { 
      background: #fff; 
      color: #000; 
    }
    .btn-outline { 
      border: 1px solid #444; 
      background: transparent; 
    }
    .btn-danger { 
      color: #ff4444; 
      border-color: #ff4444; 
    }
    
    .divider { 
      height: 1px; 
      background: #1f1f1f; 
      margin: 14px 0; 
    }

    /* Notificación Toast */
    .toast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #fff;
      color: #000;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 100;
      text-align: center;
      border: 1px solid #000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Modal de Perfil */
    .profile-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      z-index: 50;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .profile-modal.open {
      transform: translateY(0);
    }

    .modal-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f1f1f;
    }

    .modal-header h2 {
      color: #fff;
      font-size: 16px;
    }

    .close-btn {
      background: #141414;
      border: 1px solid #262626;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .profile-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .profile-hero img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }
    .profile-hero h1 {
      color: #fff;
      font-size: 20px;
      margin-bottom: 2px;
    }
    .profile-hero .hero-stats {
      color: #aaa;
      font-size: 13px;
    }

    .referral-box {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
    }
    .referral-box h3 {
      color: #fff;
      margin-bottom: 6px;
      font-size: 15px;
    }
    .referral-box p {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .referral-input-group {
      display: flex;
      gap: 8px;
    }
    .referral-input-group input {
      flex: 1;
      background: #000;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
    }
    .referral-input-group button {
      background: #fff;
      color: #000;
      border: none;
      padding: 0 14px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .comments-section h3 {
      color: #fff;
      font-size: 16px;
      margin-bottom: 12px;
      text-align: left;
    }
    .comment-card {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      text-align: left;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .comment-author {
      color: #fff;
      font-weight: 600;
      font-size: 13px;
    }
    .comment-text {
      color: #aaa;
      font-size: 13px;
      line-height: 1.4;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
      70% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <!-- Cabecera -->
    <div class="header">
      <button class="driver-avatar-btn" onclick="toggleProfile(true)">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=150&h=150" alt="Avatar">
        <div>
          <div class="name">Arnel Ospino</div>
          <div class="rating"><i class="fas fa-star" style="color:#fff;"></i> 4.95</div>
        </div>
      </button>

      <div id="statusBadge" class="status-badge-header offline">
        <span class="dot"></span> <span id="statusText">Desconectado</span>
      </div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>
    
    <!-- Panel Inferior -->
    <div class="bottom-panel" id="bottomPanel"></div>

    <!-- Toast de Notificaciones -->
    <div id="toastMessage" class="toast"></div>

    <!-- Modal de Perfil -->
    <div id="profileModal" class="profile-modal">
      <div class="modal-header">
        <h2>Perfil del Conductor</h2>
        <button class="close-btn" onclick="toggleProfile(false)"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-content">
        <div class="profile-hero">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=250&h=250" alt="Avatar">
          <div>
            <h1>Arnel Ospino</h1>
            <div class="hero-stats"><i class="fas fa-star" style="color:#fff;"></i> 4.95 • 1,204 Viajes</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="referral-box">
          <h3><i class="fas fa-user-plus" style="margin-right:6px;"></i> Invita y Gana</h3>
          <p>Gana $15 por cada amigo que complete sus primeros 10 viajes con tu enlace.</p>
          <div class="referral-input-group">
            <input type="text" id="referralCode" value="transgo.app/ref/arnel-osp" readonly>
            <button onclick="copyReferral()">Copiar</button>
          </div>
        </div>
        <div class="comments-section">
          <h3>Comentarios de Pasajeros</h3>
          <div class="comment-card">
            <div class="comment-header"><span class="comment-author">Carlos M.</span><span>⭐⭐⭐⭐⭐</span></div>
            <div class="comment-text">Excelente servicio, el auto estaba impecable y llegamos muy rápido.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // --- CONFIGURACIÓN DE SUPABASE ---
    const SUPABASE_URL = 'https://utopyogzzpajqhrpfggr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0b3B5b2d6enBhanFocnBmZ2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjA0MzEsImV4cCI6MjEwMDgzNjQzMX0.AMT3x9DjHOwoozk8zvvkl6qLAEaIj3_L2gCwhSIY45Y';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const DRIVER_ID = '22222222-2222-2222-2222-222222222222'; 

    let map, driverMarker;
    let currentTrip = null;
    let gpsWatchId = null;
    let isOnline = false; 
    let pollInterval = null;
    
    let pickupDriverMarker = null;
    let dropoffDriverMarker = null;
    let driverRouteLine = null;

    const locationChannel = supabaseClient.channel(`tracking:${DRIVER_ID}`);

    function showToast(msg) {
      const t = document.getElementById('toastMessage');
      t.innerText = msg;
      t.className = 'toast show';
      setTimeout(() => t.className = 'toast', 3000);
    }

    function initMap() {
      // Centrado inicial de respaldo en Santa Cruz, Bolivia
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-17.7833, -63.1821], 15);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

      const carIcon = L.divIcon({
        html: `<div style="background:#fff; width:22px; height:22px; border-radius:50%; border:2px solid #000; display:flex; align-items:center; justify-content:center;"><i class="fas fa-car-side" style="color:#000; font-size:9px;"></i></div>`,
        className: '', iconSize: [22, 22], iconAnchor: [11, 11]
      });
      
      driverMarker = L.marker([-17.7833, -63.1821], { icon: carIcon }).addTo(map);
      startGPS();
      renderPanel();
    }

    function startGPS() {
      if (!navigator.geolocation) return;
      gpsWatchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          driverMarker.setLatLng([lat, lng]);
          if (!currentTrip && isOnline) map.panTo([lat, lng]); 

          if (isOnline) {
            locationChannel.send({
              type: 'broadcast',
              event: 'location_update',
              payload: { driver_id: DRIVER_ID, lat, lng, timestamp: Date.now() }
            });
          }
        },
        (error) => console.error("Error GPS:", error),
        { enableHighAccuracy: true }
      );
      locationChannel.subscribe();
    }

    // Al encender el radar, se solicita explícitamente la ubicación actual del chofer
    async function toggleOnlineStatus() {
      isOnline = !isOnline;
      const badge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      
      if (isOnline) {
        badge.className = 'status-badge-header online';
        statusText.innerText = 'Conectado';
        showToast("Obteniendo ubicación GPS del conductor...");

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const lat = position.coords.latitude;
              const lng = position.coords.longitude;
              driverMarker.setLatLng([lat, lng]);
              if (!currentTrip) map.setView([lat, lng], 16);
              showToast("¡Radar activo: buscando pasajeros!");
            },
            (error) => {
              showToast("Radar activo (ubicación predeterminada)", true);
            },
            { enableHighAccuracy: true, timeout: 6000 }
          );
        }

        checkForPendingTrips();
        pollInterval = setInterval(checkForPendingTrips, 3000);
      } else {
        badge.className = 'status-badge-header offline';
        statusText.innerText = 'Desconectado';
        showToast("Radar desactivado");
        if (pollInterval) clearInterval(pollInterval);
      }
      renderPanel();
    }

    async function checkForPendingTrips() {
      if (!isOnline || currentTrip) return;

      const { data, error } = await supabaseClient
        .from('trips')
        .select('*')
        .eq('status', 'requested')
        .limit(1);

      if (error) {
        console.error("Error consultando solicitudes:", error);
        return;
      }

      if (data && data.length > 0) {
        currentTrip = data[0];
        showToast("¡Nuevo viaje encontrado en el radar!");
        renderPanel();
      }
    }

    async function acceptTrip() {
      const { error } = await supabaseClient
        .from('trips')
        .update({ status: 'accepted', driver_id: DRIVER_ID })
        .eq('id', currentTrip.id);
        
      if (!error) {
        currentTrip.status = 'accepted';
        showToast("¡Viaje aceptado! Trazando ruta vial...");
        renderPanel();
        drawStreetRouteOnDriverMap();
      } else {
        showToast("Error al aceptar: " + error.message);
      }
    }

    async function drawStreetRouteOnDriverMap() {
      if (!currentTrip) return;

      const pickup = [currentTrip.pickup_lat, currentTrip.pickup_lng];
      const dropoff = [currentTrip.dropoff_lat, currentTrip.dropoff_lng];

      const pickupIcon = L.divIcon({
        html: `<div style="background:#000; width:24px; height:24px; border-radius:50%; border:2px solid #fff; display:flex; align-items:center; justify-content:center;"><i class="fas fa-user" style="color:#fff; font-size:10px;"></i></div>`,
        className: '', iconSize: [24, 24], iconAnchor: [12, 12]
      });
      pickupDriverMarker = L.marker(pickup, { icon: pickupIcon }).addTo(map);

      const dropoffIcon = L.divIcon({
        html: `<div style="background:#fff; width:28px; height:28px; border-radius:50%; border:2px solid #000; display:flex; align-items:center; justify-content:center;"><i class="fas fa-flag-checkered" style="color:#000; font-size:11px;"></i></div>`,
        className: '', iconSize: [28, 28], iconAnchor: [14, 28]
      });
      dropoffDriverMarker = L.marker(dropoff, { icon: dropoffIcon }).addTo(map);

      const url = `https://router.project-osrm.org/route/v1/driving/${pickup[1]},${pickup[0]};${dropoff[1]},${dropoff[0]}?overview=full&geometries=geojson`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const streetCoords = route.geometry.coordinates.map(c => [c[1], c[0]]);

          if (driverRouteLine) {
            driverRouteLine.setLatLngs(streetCoords);
          } else {
            driverRouteLine = L.polyline(streetCoords, { color: '#000', weight: 5, opacity: 0.85 }).addTo(map);
          }

          const bounds = L.latLngBounds([pickup, dropoff]);
          map.fitBounds(bounds, { padding: [50, 50] });
          showToast("Ruta vial trazada con éxito");
          return;
        }
      } catch (err) {
        console.warn("Servicio vial ocupado, usando línea directa de respaldo.");
      }

      if (driverRouteLine) driverRouteLine.setLatLngs([pickup, dropoff]);
      else driverRouteLine = L.polyline([pickup, dropoff], { color: '#000', weight: 5, opacity: 0.85 }).addTo(map);
      
      const bounds = L.latLngBounds([pickup, dropoff]);
      map.fitBounds(bounds, { padding: [50, 50] });
    }

    async function finishTrip() {
      const { error } = await supabaseClient
        .from('trips')
        .update({ status: 'completed' })
        .eq('id', currentTrip.id);
        
      if (!error) {
        if (pickupDriverMarker) { map.removeLayer(pickupDriverMarker); pickupDriverMarker = null; }
        if (dropoffDriverMarker) { map.removeLayer(dropoffDriverMarker); dropoffDriverMarker = null; }
        if (driverRouteLine) { map.removeLayer(driverRouteLine); driverRouteLine = null; }

        currentTrip = null;
        showToast("Viaje finalizado con éxito");
        renderPanel();
        map.setView(driverMarker.getLatLng(), 16);
      } else {
        showToast("Error al finalizar: " + error.message);
      }
    }

    function renderPanel() {
      const panel = document.getElementById('bottomPanel');
      
      if (!isOnline && !currentTrip) {
        panel.innerHTML = `
          <div style="text-align:center;">
            <p style="color:#aaa; margin-bottom:14px; font-size:13px;">Estás desconectado.</p>
            <button class="btn btn-primary" onclick="toggleOnlineStatus()">
              <i class="fas fa-power-off"></i> Iniciar Radar
            </button>
          </div>
        `;
      } else if (isOnline && !currentTrip) {
        panel.innerHTML = `
          <div style="text-align:center;">
            <div style="margin-bottom: 12px;">
              <i class="fas fa-satellite-dish dot" style="font-size:24px; color:#fff; animation: pulse 1.5s infinite; background:none;"></i>
            </div>
            <p style="color:#aaa; margin-bottom:14px; font-size:13px;">Buscando pasajeros...</p>
            <button class="btn btn-outline" onclick="toggleOnlineStatus()">
              Desconectarse
            </button>
          </div>
        `;
      } else if (currentTrip && currentTrip.status === 'requested') {
        panel.innerHTML = `
          <div class="card" style="border-color:#fff;">
            <div style="font-weight:600; font-size:14px; color:#fff; margin-bottom:6px;">
              <i class="fas fa-user"></i> Solicitud de viaje entrante
            </div>
            <div style="color:#aaa; font-size:13px; margin-bottom:14px;">
              Un pasajero está esperando confirmación.
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-outline btn-danger" onclick="currentTrip=null; renderPanel()">Ignorar</button>
              <button class="btn btn-primary" onclick="acceptTrip()">Aceptar</button>
            </div>
          </div>
        `;
      } else if (currentTrip && currentTrip.status === 'accepted') {
        panel.innerHTML = `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <span style="font-weight:600; font-size:15px; color:#fff;">Viaje en curso</span>
              <span style="color:#aaa; font-size:11px;">Navegando por las calles</span>
            </div>
            <button class="btn btn-primary" onclick="finishTrip()">Finalizar viaje</button>
          </div>
        `;
      }
    }

    function toggleProfile(show) {
      document.getElementById('profileModal').className = show ? 'profile-modal open' : 'profile-modal';
    }

    function copyReferral() {
      navigator.clipboard.writeText(document.getElementById('referralCode').value);
      showToast("¡Enlace copiado!");
    }

    window.onload = initMap;
  </script>
</body>
</html>
