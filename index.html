<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TransGo Pasajero — Blanco & Negro</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background: #000; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
    }

    .phone {
      width: 100%; 
      max-width: 410px; 
      height: 100vh; 
      max-height: 840px;
      background: #0a0a0a;
      border-radius: 0; 
      overflow: hidden; 
      position: relative;
      display: flex; 
      flex-direction: column;
    }

    @media (min-width: 480px) {
      .phone {
        border-radius: 44px;
        box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #333, 0 30px 60px rgba(0,0,0,0.9);
      }
    }

    .header {
      background: #0a0a0a; 
      padding: 14px 16px; 
      display: flex;
      justify-content: space-between; 
      align-items: center; 
      z-index: 20;
      border-bottom: 1px solid #1f1f1f;
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .client-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #141414;
      border: 1px solid #262626;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
    }

    #map { 
      flex: 1; 
      width: 100%; 
      background: #111; 
      z-index: 1; 
    }

    .bottom-panel {
      background: rgba(10, 10, 10, 0.95); 
      border-top: 1px solid #1f1f1f;
      padding: 16px 16px 24px; 
      z-index: 10; 
      backdrop-filter: blur(12px);
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
    }

    .card { 
      background: #141414; 
      border: 1px solid #262626; 
      border-radius: 20px; 
      padding: 16px; 
      text-align: left;
    }
    
    .btn {
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px;
      background: #1a1a1a; 
      color: #fff; 
      padding: 14px 20px; 
      border-radius: 16px;
      font-weight: 600; 
      font-size: 15px;
      border: none; 
      cursor: pointer; 
      width: 100%;
      transition: opacity 0.2s, transform 0.1s;
    }
    
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-primary { 
      background: #fff; 
      color: #000; 
    }
    .btn-outline { 
      border: 1px solid #444; 
      background: transparent; 
    }
    .btn-danger { 
      color: #ff4444; 
      border-color: #ff4444; 
    }
    
    .trip-info-row {
      display: flex;
      justify-content: space-between;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .trip-info-row strong {
      color: #fff;
    }

    /* Notificación Toast */
    .toast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #fff;
      color: #000;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      max-width: 90%;
      text-align: center;
      border: 1px solid #000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error {
      background: #ff4444;
      color: #fff;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
      70% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <!-- Cabecera -->
    <div class="header">
      <div class="logo">
        <i class="fas fa-location-arrow"></i> TransGo Client
      </div>
      <div class="client-avatar">
        <i class="fas fa-user"></i>
      </div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>
    
    <!-- Panel Inferior -->
    <div class="bottom-panel" id="bottomPanel"></div>

    <!-- Toast de Notificaciones -->
    <div id="toastMessage" class="toast"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // --- CONFIGURACIÓN DE SUPABASE ---
        // --- CONFIGURACIÓN DE SUPABASE ---
    const SUPABASE_URL = 'https://utopyogzzpajqhrpfggr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0b3B5b2d6enBhanFocnBmZ2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjA0MzEsImV4cCI6MjEwMDgzNjQzMX0.AMT3x9DjHOwoozk8zvvkl6qLAEaIj3_L2gCwhSIY45Y';

    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let map;
    let clientPosition = null;       // Ubicación actual (Origen / Pickup)
    let pickupMarker = null;         // Marcador del cliente
    let destinationMarker = null;    // Pin de destino
    let destinationCoords = null;    // Coordenadas de destino (Dropoff)
    let routeLine = null;            // Línea de ruta en el mapa
    let currentActiveTripId = null;
    let tripDetails = { distance: "3.5", duration: "8", price: "9.00" };

    function showToast(message, isError = false) {
      const toast = document.getElementById('toastMessage');
      toast.innerText = message;
      toast.className = isError ? 'toast show error' : 'toast show';
      setTimeout(() => { toast.className = 'toast'; }, 4000);
    }

    function initMap() {
      // Centrado inicial en Santa Cruz de la Sierra, Bolivia
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-17.7833, -63.1821], 15);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

      renderPanel('not_located');

      map.on('click', (e) => {
        if (!clientPosition) {
          showToast("Primero debes activar tu ubicación", true);
          return;
        }
        if (currentActiveTripId) return; 

        destinationCoords = [e.latlng.lat, e.latlng.lng];

        const pinIcon = L.divIcon({
          html: `<div style="background:#fff; width:32px; height:32px; border-radius:50%; border:2px solid #000; display:flex; align-items:center; justify-content:center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"><i class="fas fa-map-marker-alt" style="color:#000; font-size:14px;"></i></div>`,
          className: '', iconSize: [32, 32], iconAnchor: [16, 32]
        });

        if (destinationMarker) {
          destinationMarker.setLatLng(destinationCoords);
        } else {
          destinationMarker = L.marker(destinationCoords, { icon: pinIcon }).addTo(map);
        }

        // Trazar ruta
        calculateStreetRoute(clientPosition, destinationCoords);
      });
    }

    function activateLocation() {
      showToast("Buscando tu ubicación GPS...");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            clientPosition = [position.coords.latitude, position.coords.longitude];
            map.setView(clientPosition, 16);

            const pickupIcon = L.divIcon({
              html: `<div style="background:#000; width:16px; height:16px; border-radius:50%; border:3px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>`,
              className: '', iconSize: [16, 16], iconAnchor: [8, 8]
            });
            
            if (pickupMarker) {
              pickupMarker.setLatLng(clientPosition);
            } else {
              pickupMarker = L.marker(clientPosition, { icon: pickupIcon }).addTo(map);
            }

            showToast("¡Ubicación activada con éxito!");
            renderPanel('initial');
          },
          (error) => {
            showToast("GPS no disponible. Ubicación asignada en Santa Cruz, Bolivia", true);
            clientPosition = [-17.7833, -63.1821]; 
            map.setView(clientPosition, 15);
            
            const pickupIcon = L.divIcon({
              html: `<div style="background:#000; width:16px; height:16px; border-radius:50%; border:3px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>`,
              className: '', iconSize: [16, 16], iconAnchor: [8, 8]
            });
            
            if (pickupMarker) {
              pickupMarker.setLatLng(clientPosition);
            } else {
              pickupMarker = L.marker(clientPosition, { icon: pickupIcon }).addTo(map);
            }
            
            renderPanel('initial');
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        showToast("Geolocalización no soportada", true);
      }
    }

    // Función para trazar ruta con color NEGRO para contraste en mapa claro
    async function calculateStreetRoute(start, end) {
      showToast("Trazando ruta...");
      const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const streetCoords = route.geometry.coordinates.map(c => [c[1], c[0]]);

          if (routeLine) {
            routeLine.setLatLngs(streetCoords);
          } else {
            // Ruta en color negro (#000) para excelente contraste
            routeLine = L.polyline(streetCoords, { color: '#000', weight: 5, opacity: 0.85 }).addTo(map);
          }

          const distanceKm = (route.distance / 1000).toFixed(1);
          const durationMins = Math.round(route.duration / 60);
          const calculatedPrice = (distanceKm * 2 + 4).toFixed(2);

          tripDetails = { distance: distanceKm, duration: durationMins, price: calculatedPrice };
          renderPanel('destination_selected');
          showToast("Ruta lista");
          return;
        }
      } catch (err) {
        console.warn("Servicio vial ocupado, usando línea directa de respaldo.");
      }

      // Respaldo directo en negro si el servidor vial demora
      if (routeLine) routeLine.setLatLngs([start, end]);
      else routeLine = L.polyline([start, end], { color: '#000', weight: 4, opacity: 0.85 }).addTo(map);
      
      tripDetails = { distance: "3.5", duration: "8", price: "9.00" };
      renderPanel('destination_selected');
      showToast("Ruta trazada");
    }

    async function requestTrip() {
      if (!destinationCoords || !clientPosition) {
        showToast("Selecciona un destino en el mapa", true);
        return;
      }

      renderPanel('searching');
      showToast("Conectando con la red TransGo...");

      const { data, error } = await supabaseClient
        .from('trips')
        .insert([
          {
            status: 'requested',
            pickup_lat: clientPosition[0],
            pickup_lng: clientPosition[1],
            dropoff_lat: destinationCoords[0],
            dropoff_lng: destinationCoords[1],
            passenger_id: '11111111-1111-1111-1111-111111111111' 
          }
        ])
        .select();

      if (error) {
        showToast("Error Supabase: " + error.message, true);
        console.error("Error completo:", error);
        renderPanel('destination_selected');
        return;
      }

      showToast("¡Viaje solicitado con éxito!");
      currentActiveTripId = data[0].id;
      listenTripStatus(currentActiveTripId);
    }

    function listenTripStatus(tripId) {
      supabaseClient.channel(`trip_status_${tripId}`)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'trips', filter: `id=eq.${tripId}` }, payload => {
          const updatedTrip = payload.new;
          if (updatedTrip.status === 'accepted') {
            showToast("¡Un conductor ha aceptado tu viaje!");
            renderPanel('accepted');
          } else if (updatedTrip.status === 'completed') {
            showToast("¡Has llegado a tu destino!");
            resetApp();
          }
        })
        .subscribe();
    }

    async function cancelTrip() {
      if (currentActiveTripId) {
        await supabaseClient.from('trips').delete().eq('id', currentActiveTripId);
      }
      showToast("Viaje cancelado");
      resetApp();
    }

    function resetApp() {
      currentActiveTripId = null;
      destinationCoords = null;
      if (destinationMarker) { map.removeLayer(destinationMarker); destinationMarker = null; }
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      if (clientPosition) map.setView(clientPosition, 16);
      renderPanel('initial');
    }

    function renderPanel(state) {
      const panel = document.getElementById('bottomPanel');

      if (state === 'not_located') {
        panel.innerHTML = `
          <div class="card" style="text-align:center;">
            <p style="color:#aaa; font-size:13px; margin-bottom:12px;">Activa tu ubicación para fijar el punto de recogida.</p>
            <button class="btn btn-primary" onclick="activateLocation()">
              <i class="fas fa-location-crosshairs"></i> Activar mi ubicación
            </button>
          </div>
        `;
      } else if (state === 'initial') {
        panel.innerHTML = `
          <div class="card" style="text-align:center;">
            <p style="color:#aaa; font-size:13px; margin-bottom:4px;"><i class="fas fa-hand-pointer" style="margin-right:6px;"></i> Ubicación activa en Santa Cruz</p>
            <p style="color:#fff; font-weight:600; font-size:14px;">Toca el mapa para marcar tu destino</p>
          </div>
        `;
      } else if (state === 'destination_selected') {
        panel.innerHTML = `
          <div class="card">
            <div class="trip-info-row">
              <span>Distancia / Tiempo:</span>
              <strong>${tripDetails.distance} km (~${tripDetails.duration} mins)</strong>
            </div>
            <div class="trip-info-row" style="margin-bottom:14px;">
              <span>Tarifa estimada:</span>
              <strong>$${tripDetails.price}</strong>
            </div>
            <button class="btn btn-primary" onclick="requestTrip()">
              <i class="fas fa-arrow-right"></i> Pedir TransGo
            </button>
          </div>
        `;
      } else if (state === 'searching') {
        panel.innerHTML = `
          <div class="card" style="text-align:center;">
            <div style="margin-bottom: 10px;">
              <i class="fas fa-satellite-dish" style="font-size:22px; color:#fff; animation: pulse 1.5s infinite;"></i>
            </div>
            <p style="color:#fff; font-weight:600; font-size:14px; margin-bottom:4px;">Buscando conductor cercano...</p>
            <p style="color:#aaa; font-size:12px; margin-bottom:14px;">El conductor ya ve tu ruta en su radar</p>
            <button class="btn btn-outline btn-danger" onclick="cancelTrip()">Cancelar búsqueda</button>
          </div>
        `;
      } else if (state === 'accepted') {
        panel.innerHTML = `
          <div class="card" style="border-color:#fff;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span style="font-weight:600; font-size:14px; color:#fff;">¡Conductor en camino!</span>
              <span style="color:#aaa; font-size:11px;"><i class="fas fa-car-side"></i> Arnel Ospino</span>
            </div>
            <div class="trip-info-row" style="margin-bottom:14px;">
              <span>Vehículo:</span>
              <strong>Chevrolet Spark (Blanco)</strong>
            </div>
            <button class="btn btn-outline btn-danger" onclick="cancelTrip()">Cancelar viaje</button>
          </div>
        `;
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
